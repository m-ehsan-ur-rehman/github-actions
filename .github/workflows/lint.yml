#linter for checking code indentation,errors and bugs.
#as a user commit changes in a python file linter should check it.
#workflow
name: linter
on:
  push:
    paths:
      - '**.py'
      - '**/*.py'
    
jobs:
  code-linter:
    runs-on: ubuntu-latest
    steps:
      - name: checkouts code
        uses: actions/checkout@v7
      - name: Setup python
        uses: actions/setup-python@v7
        with: 
            python-verison: '3.14'
      - name: installs linter
        run: pip install ruff
      - name: check the files for linting
        run: ruff check .
